<ion-header>
  <ion-toolbar>
    <ion-title>Histórico</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of historico">
      <ion-label>
        {{ item.valor }} {{ item.de }} → {{ item.resultado | number:'1.2-2' }} {{ item.para }}
        <p>{{ item.data }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
