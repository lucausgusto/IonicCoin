<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      IonicCoin
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">IonicCoin</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
  <ion-label>De:</ion-label>
  <ion-select [(ngModel)]="fromCurrency">
    <ion-select-option *ngFor="let c of currencies" [value]="c">{{ c }}</ion-select-option>
  </ion-select>
</ion-item>

  <ion-button (click)="swap()">⇄ Inverter</ion-button>

<ion-item>
  <ion-label>Para:</ion-label>
  <ion-select [(ngModel)]="toCurrency">
    <ion-select-option *ngFor="let c of currencies" [value]="c">{{ c }}</ion-select-option>
  </ion-select>
</ion-item>

  <ion-item>
    <ion-label>Valor:</ion-label>
    <ion-input type="number" [(ngModel)]="amount"></ion-input>
  </ion-item>

  <ion-button (click)="convert()">Converter</ion-button>

  <h2 *ngIf="result !== null">Resultado: {{ result }}</h2>
  <ion-button routerLink="/history">Ver Histórico</ion-button>
</ion-content>
